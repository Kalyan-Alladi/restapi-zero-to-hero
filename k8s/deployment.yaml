apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-microservice
  namespace: user-microservice
  labels:
    app: user-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-microservice
  template:
    metadata:
      labels:
        app: user-microservice
    spec:
      containers:
      - name: user-api
        image: usermicroserviceacr.azurecr.io/user-microservice:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: keyvault-secrets
              key: DatabaseConnectionString
        - name: JwtSettings__Secret
          valueFrom:
            secretKeyRef:
              name: keyvault-secrets
              key: JwtSecret
        - name: ApiSettings__ApiKey
          valueFrom:
            secretKeyRef:
              name: keyvault-secrets
              key: ApiKey
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: keyvault-secrets
              key: ApplicationInsightsConnectionString
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets-store"
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-keyvault-user-microservice"